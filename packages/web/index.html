0%3Ccircle%20cx%3D%22103%22%20cy%3D%2235%22%20r%3D%224.5%22%20fill%3D%22%23059669%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%22103%22%20cy%3D%2285%22%20r%3D%224.5%22%20fill%3D%22%232563eb%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2260%22%20cy%3D%22110%22%20r%3D%224.5%22%20fill%3D%22%23059669%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2217%22%20cy%3D%2285%22%20r%3D%224.5%22%20fill%3D%22%232563eb%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2217%22%20cy%3D%2235%22%20r%3D%224.5%22%20fill%3D%22%23059669%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%20%20%3Cpolygon%20points%3D%2260%2C42%2060%2C78%2040%2C60%22%20fill%3D%22url(%23diaLeft)%22%2F%3E%0A%20%20%3Cpolygon%20points%3D%2260%2C42%2060%2C78%2080%2C60%22%20fill%3D%22url(%23diaRight)%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2260%22%20cy%3D%2234%22%20r%3D%227%22%20fill%3D%22%233b82f6%22%20opacity%3D%220.25%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2260%22%20cy%3D%2234%22%20r%3D%224%22%20fill%3D%22%231e3a8a%22%2F%3E%0A%3C%2Fsvg%3E" />
    <title>DLMetaWork</title>
    <script>
      (() => {
        // Bugfix: Web 远控跨 workspace 跳转时，JS bundle 还没执行前就会先渲染启动壳。
        // 这里提前按本地主题偏好决定首屏底色，避免 dark 用户在这一帧看到白底闪烁。
        const STORAGE_KEY = "zcode-theme";
        const DEFAULT_THEME = "zai-dark";
        const BROWSER_THEME_COLORS = {
          dark: "#161616",
          light: "#f8f8f8",
        };
        const BOOTSTRAP_SNAPSHOT_KEY = "zcode:web-remote-control:bootstrap-shell";

        const normalizeResolvedTheme = (theme) => {
          if (theme === "dark") return "dark";
          if (theme === "light") return "light";
          if (theme === "zai-dark") return "dark";
          if (theme === "zai-light") return "light";
          return theme;
        };

        const syncBrowserThemeSurface = (theme) => {
          document.documentElement.setAttribute("data-zcode-browser-theme-surface", theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", BROWSER_THEME_COLORS[theme]);
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        };

        try {
          let bootstrapTheme = null;
          const bootstrapSnapshotRaw = window.sessionStorage.getItem(BOOTSTRAP_SNAPSHOT_KEY);
          if (bootstrapSnapshotRaw) {
            window.sessionStorage.removeItem(BOOTSTRAP_SNAPSHOT_KEY);
            try {
              const snapshot = JSON.parse(bootstrapSnapshotRaw);
              if (snapshot && typeof snapshot === "object") {
                const normalizedTheme = snapshot.theme === "dark" ? "dark" : "light";
                bootstrapTheme = normalizedTheme;
                document.documentElement.style.setProperty(
                  "--zcode-bootstrap-bg",
                  typeof snapshot.background === "string"
                    ? snapshot.background
                    : normalizedTheme === "dark"
                      ? "#0f172a"
                      : "#f8fafc",
                );
                document.documentElement.style.setProperty(
                  "--zcode-bootstrap-fg",
                  typeof snapshot.foreground === "string"
                    ? snapshot.foreground
                    : normalizedTheme === "dark"
                      ? "#e2e8f0"
                      : "#334155",
                );
                if (typeof snapshot.border === "string") {
                  document.documentElement.style.setProperty(
                    "--zcode-bootstrap-border",
                    snapshot.border,
                  );
                }
                if (typeof snapshot.card === "string") {
                  document.documentElement.style.setProperty(
                    "--zcode-bootstrap-card",
                    snapshot.card,
                  );
                }
              }
            } catch {
              // ignore invalid snapshot
            }
          }

          const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
          const resolved =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : normalizeResolvedTheme(saved);
          const fallbackTheme = resolved === "dark" ? "dark" : "light";
          const finalTheme = bootstrapTheme ?? fallbackTheme;
          document.documentElement.setAttribute("data-zcode-bootstrap-theme", finalTheme);
          syncBrowserThemeSurface(finalTheme);
          if (finalTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          document.documentElement.setAttribute("data-zcode-bootstrap-theme", "dark");
          syncBrowserThemeSurface("dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--zcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-zcode-bootstrap-theme="light"] body {
        background: var(--zcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-zcode-browser-theme-surface],
      html[data-zcode-browser-theme-surface] body,
      html[data-zcode-browser-theme-surface] #root {
        /* 修复原因：共享 UI 样式为 Electron vibrancy 强制透明根背景；浏览器入口必须用语义背景
           覆盖该桌面专属行为，否则浏览器工具栏、overscroll 和页面画布会回退为系统白色。 */
        background: var(--color-background, var(--zcode-bootstrap-bg, #161616)) !important;
      }

      html[data-zcode-browser-theme-surface="light"],
      html[data-zcode-browser-theme-surface="light"] body,
      html[data-zcode-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--zcode-bootstrap-bg, #f8f8f8)) !important;
      }

      .zcode-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* Bugfix: UI 全局样式会把 body/#root 置为透明，预渲染壳必须自己承接主题背景，否则深色主题会露出浏览器白底。 */
        background: var(--zcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-zcode-bootstrap-theme="light"] .zcode-boot-loading {
        background: var(--zcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      .zcode-boot-loading__logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
      }

      .zcode-boot-loading__logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 修复原因：启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。 */
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .zcode-boot-loading__logo {
        width: 56px;
        height: auto;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Bugfix: 远程控制跨 workspace 时会整页跳转；在 JS 入口执行前先给出 loading 壳，避免出现白屏空档。 -->
      <div
        class="zcode-boot-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading..."
      >
        <div class="zcode-boot-loading__logo-shell">
          <!-- 品牌标记；母版在 packages/biz-brand/src/index.ts，静态壳不能 import，改母版时同步这里。 -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 120 120"
            class="zcode-boot-loading__logo"
            aria-hidden="true"
          >
            <animate
              attributeName="opacity"
              dur="1.5s"
              repeatCount="indefinite"
              values="1;0.3;1"
            />
            <defs>
              <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2563eb" />
                <stop offset="100%" stop-color="#059669" />
              </linearGradient>
              <linearGradient id="diaLeft" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#1e3a8a" />
                <stop offset="100%" stop-color="#2563eb" />
              </linearGradient>
              <linearGradient id="diaRight" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#059669" />
                <stop offset="100%" stop-color="#16a34a" />
              </linearGradient>
            </defs>
            <polygon
              points="60,10 103,35 103,85 60,110 17,85 17,35"
              fill="none"
              stroke="url(#hexGrad)"
              stroke-width="4"
              stroke-linejoin="round"
            />
            <g stroke="#bfdbfe" stroke-width="1.6">
              <line x1="60" y1="10" x2="60" y2="110" />
              <line x1="17" y1="35" x2="103" y2="85" />
              <line x1="103" y1="35" x2="17" y2="85" />
            </g>
            <g>
              <circle cx="60" cy="10" r="4.5" fill="#2563eb" />
              <circle cx="103" cy="35" r="4.5" fill="#059669" />
              <circle cx="103" cy="85" r="4.5" fill="#2563eb" />
              <circle cx="60" cy="110" r="4.5" fill="#059669" />
              <circle cx="17" cy="85" r="4.5" fill="#2563eb" />
              <circle cx="17" cy="35" r="4.5" fill="#059669" />
            </g>
            <polygon points="60,42 60,78 40,60" fill="url(#diaLeft)" />
            <polygon points="60,42 60,78 80,60" fill="url(#diaRight)" />
            <circle cx="60" cy="34" r="7" fill="#3b82f6" opacity="0.25" />
            <circle cx="60" cy="34" r="4" fill="#1e3a8a" />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
